  <!-- glossy cap and shine -->
  <path d="M62 112 C72 82 100 70 128 70 C160 70 184 84 192 106 C170 96 90 94 62 112 Z" fill="url(#gloss)"/>
  <ellipse cx="78" cy="112" rx="11" ry="16" transform="rotate(28 78 112)" fill="#fff" opacity="0.9"/>
  <circle cx="97" cy="92" r="5" fill="#fff" opacity="0.85"/>
  <!-- little cherry on top -->
  <path d="M146 60 C150 44 158 34 170 28" stroke="#3f8f3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M168 30 C178 22 190 24 194 30 C184 36 176 36 168 30 Z" fill="#5cc452"/>
  <circle cx="140" cy="58" r="15" fill="url(#cherry)"/>
  <circle cx="135" cy="53" r="4" fill="#fff" opacity="0.8"/>
  <!-- face -->
  <ellipse cx="98" cy="152" rx="11" ry="14" fill="#1b2a33"/>
  <ellipse cx="158" cy="152" rx="11" ry="14" fill="#1b2a33"/>
  <circle cx="102" cy="146" r="4.5" fill="#fff"/>
  <circle cx="162" cy="146" r="4.5" fill="#fff"/>
  <circle cx="95" cy="157" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="155" cy="157" r="2" fill="#fff" opacity="0.8"/>
  <ellipse cx="76" cy="176" rx="18" ry="11" fill="url(#cheek)"/>
  <ellipse cx="180" cy="176" rx="18" ry="11" fill="url(#cheek)"/>
  <path d="M118 172 Q123 180 128 172 Q133 180 138 172" stroke="#1b2a33" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
