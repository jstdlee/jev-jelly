<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="body" cx="42%" cy="34%" r="75%">
      <stop offset="0" stop-color="#b8ffe4"/>
      <stop offset="0.45" stop-color="#5ee8b7"/>
      <stop offset="1" stop-color="#1fb58a"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b3b2e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b3b2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7fa8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff7fa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cherry" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff9fb5"/>
      <stop offset="1" stop-color="#e0245e"/>
    </radialGradient>
  </defs>
  <!-- soft floor shadow -->
  <ellipse cx="128" cy="222" rx="92" ry="14" fill="url(#shadow)"/>
  <!-- the jelly: a squishy dome with a slightly wobbly foot -->
  <path d="M28 196 C22 120 62 58 128 58 C194 58 234 120 228 196 C228 214 206 220 184 216 C160 222 150 214 128 218 C104 222 92 214 70 218 C48 222 28 214 28 196 Z"
